{% extends "base.html" %}

{% block title %}
    Create Assessment
{% endblock %}

{% block content %}
    <h2>New Assessment - {{ patient.first_name }} {{ patient.last_name }}</h2>
    <form method="post"
        action="/ui/patients/{{ patient.id }}/assessments">
            <label for="assessment_date">Assessment date:</label>
            <input type="date" id="assessment_date" name="assessment_date" required>
            <label for="score">Assessment score:</label>
            <input type="number" id="score" name="score" min="0" max="100" required>
        <button type="submit">Save assessment</button>
    </form>
{% endblock %}
