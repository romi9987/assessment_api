{% extends "base.html" %}

{% block title %}
    Login
{% endblock %}

{% block content %}
    <h2>Login</h2>

    <form id="login-form">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <p id="login-error" role="alert"></p>

    <script>
        // event.preventDefault() 
        // Prevents the browser from submitting the form using its default behavior. 
        // Instead, JavaScript handles the request.
        document.getElementById("login-form").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorElement = document.getElementById("login-error");

            errorElement.textContent = "";

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    // credentials: "same-origin"
                    // Allows the browser to include cookies in same-origin requests 
                    // and accept the session cookie returned by your login endpoint.
                    credentials: "same-origin",
                    // JSON.stringify()
                    // Converts a JavaScript object into a JSON string 
                    // that FastAPI can deserialize into your UserLogin Pydantic model.
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                if (!response.ok) {
                    errorElement.textContent = "Invalid email or password.";
                    return;
                }

                // window.location.href - Navigates to the patient list after a successful login.
                window.location.href = "/ui/patients";

            } catch (error) {
                errorElement.textContent = "Unable to connect to the server.";
                console.error("Login failed:", error);
            }
        });
    </script>
{% endblock %}
