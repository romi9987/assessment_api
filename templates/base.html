<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Patient Assessment{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <script>
        document.addEventListener("htmx:beforeSwap", function(event) {
            if (event.detail.xhr.status === 422) {
                event.detail.shouldSwap = true;
                event.detail.isError = false;
            }
        });

        // async function - Defines a function that can perform asynchronous operations
        async function loadCsrfToken() {
            // const - Declares a variable that cannot be reassigned
            // await fetch(...) - Sends an HTTP request and waits for its response
            const response = await fetch("/auth/csrf", {
                // credentials: "same-origin" ensures the browser includes your session cookie for requests to your own application.
                credentials: "same-origin",
                // cache: "no-store" instructs the browser not to use a cached response.
                cache: "no-store"
            });

            // if (!response.ok) - Checks whether the HTTP request failed
            if (!response.ok) {
                // throw new Error(...) - Raises an error, similar to Python's raise
                throw new Error("Could not retrieve CSRF token.");
            }

            // await response.json() - Converts the JSON response into a JavaScript object
            const data = await response.json();
            // return data.csrf_token - Returns the CSRF token from that object
            return data.csrf_token;
        }
    
        // csrfToken = null means we haven't received a token yet.
        let csrfToken = null;

        if (window.location.pathname !== "/ui/login") {
            // loadCsrfToken() calls your FastAPI endpoint.
            loadCsrfToken()
                // .then(...) saves the token after a successful response.
                .then(token => {
                    csrfToken = token;
                })
                // .catch(...) handles an unsuccessful token retrieval.
                .catch(error => {
                    console.error("CSRF initialization failed:", error);
                });
        }

        // htmx:configRequest runs before HTMX sends a request.
        document.addEventListener("htmx:configRequest", function(event) {
            // For POST, PUT, PATCH, and DELETE, the code attaches X-CSRF-Token.
            const method = event.detail.verb.toUpperCase();

            if (["POST", "PUT", "PATCH", "DELETE"].includes(method)) {
                // If no token is available, it cancels the modifying request.
                if (!csrfToken) {
                    event.preventDefault();
                    alert("Your session may have expired. Please log in again.");
                    return;
                }

                event.detail.headers["X-CSRF-Token"] = csrfToken;
            }
        });
    </script>

    <style>
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: inline;
        }
    </style>
</head>
<body>
    <h1>Patient Assessment</h1>
    <nav>
        {% if request.url.path == "/ui/login" %}
            <a href="/ui/login">Login</a>
        {% else %}
            <button type="button" hx-post="/auth/logout" hx-swap="none">
                Logout
            </button>
            <a href="/ui/patients/new">Add patient</a>
            <a href="/ui/patients">Patients</a>
        {% endif %}
    </nav>

    {% block content %}
    {% endblock %}
</body>
</html>
