{% extends "base.html" %}

{% block title %}
    Patients
{% endblock %}

{% block content %}
    <h2>Patients</h2>

    <input
        type="search"
        name="q"
        placeholder="Search by last name..."
        hx-get="/ui/patients/search"
        hx-trigger="input changed delay:300ms"
        hx-target="#patient-list"
        hx-swap="innerHTML"
    >

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>First name</th>
                <th>Last name</th>
                <th>Birthdate</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="patient-list">
            {% include "partials/patient_rows.html" %}
        </tbody>
    </table>

    <button
        hx-get="/ui/message"
        hx-target="#message"
        hx-swap="beforeend"
    >
        Load message
    </button>

    <div id="message">Waiting...</div>
{% endblock %}
