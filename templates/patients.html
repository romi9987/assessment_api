{% extends "base.html" %}

{% block title %}
    Patients
{% endblock %}

{% block content %}
    <h2>Patients</h2>

    <input
        type="search"
        name="q"
        placeholder="Search by last name..."
        hx-get="/ui/patients?page=1"
        hx-trigger="input changed delay:300ms"
        hx-target="#patients-content"
        hx-swap="innerHTML"
        hx-push-url="true"
        hx-indicator="#search-loading"
    >
    <span id="search-loading" class="htmx-indicator">
        Searching...
    </span>

    <div 
        id="patients-content"
        hx-get="/ui/patients?page=1"
        hx-target="#patients-content"
        hx-swap="innerHTML"
    >
        {% include "partials/patients_content.html" %}
    </div>

    <script>
        document.body.addEventListener("patientDeleted", function() {
            const url = window.location.pathname + window.location.search;

            htmx.ajax("GET", url, {
                target: "#patients-content",
                swap: "innerHTML"
            });
        });
    </script>

{% endblock %}
