{% extends "base.html" %}

{% block title %}
    Patients
{% endblock %}

{% block content %}
    <h2>Patients</h2>

    <input
        type="search"
        name="q"
        placeholder="Search by last name..."
        hx-get="/ui/patients?page=1"
        hx-trigger="input changed delay:300ms"
        hx-target="#patients-content"
        hx-swap="innerHTML"
        hx-push-url="true"
        hx-indicator="#search-loading"
    >
    <span id="search-loading" class="htmx-indicator">
        Searching...
    </span>

    <div 
        id="patients-content"
        hx-get="/ui/patients?page=1"
        hx-trigger="patientDeleted from: body"
        hx-target="#patients-content"
        hx-swap="innerHTML"
    >
        {% include "partials/patients_content.html" %}
    </div>

    <button
        hx-get="/ui/message"
        hx-target="#message"
        hx-swap="beforeend"
    >
        Load message
    </button>

    <div id="message">Waiting...</div>
{% endblock %}
