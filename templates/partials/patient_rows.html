<!--Notice that this fragment contains neither <table> nor <tbody>. 
    It contains only the rows that belong inside the table body.-->
{% for patient in patients %}
    <tr>
        <td>{{ patient.id }}</td>
        <td>{{ patient.first_name }}</td>
        <td>{{ patient.last_name }}</td>
        <td>{{ patient.birthdate }}</td>
        <td>{{ patient.email if patient.email else "—" }}</td>
    </tr>
{% else %}
    <tr>
        <td colspan="5">No patients found.</td>
    </tr>
{% endfor %}
