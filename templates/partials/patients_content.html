<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>First name</th>
            <th>Last name</th>
            <th>Birthdate</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody id="patient-list">
        {% include "partials/patient_rows.html" %}
    </tbody>
</table>

<div>
    {% if has_previous %}
        <a 
            hx-get="/ui/patients?page={{ page - 1 }}&q={{ q | urlencode }}"
            hx-target="#patients-content"
            hx-swap="innerHTML"
        >
        <!--{{ q | urlencode }} safely encodes the search term for inclusion in a URL.-->
            Previous
        </a>
    {% endif %}

    <span>Page {{ page }}</span>

    {% if has_next %}
        <a
            hx-get="/ui/patients?page={{ page + 1 }}&q={{ q | urlencode }}"
            hx-target="#patients-content"
            hx-swap="innerHTML"
        >
            Next
        </a>
    {% endif %}
</div>
