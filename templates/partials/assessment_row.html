<tr id="assessment-{{ assessment.id }}">
    <td>{{ assessment.id }}</td>
    <td>{{ assessment.assessment_date }}</td>
    <td>{{ assessment.score }}</td>
    <td>        
        <button 
            type="button"
            hx-get="/ui/patients/{{ patient_id }}/assessments/{{ assessment.id }}/edit"
            hx-target="#assessment-{{ assessment.id }}"
            hx-swap="outerHTML"
        >
            Edit
        </button>

        <button
            type="button"
            hx-delete="/ui/patients/{{ patient_id }}/assessments/{{ assessment.id }}"
            hx-target="#assessment-{{ assessment.id }}"
            hx-swap="outerHTML"
            hx-confirm="Are you sure you want to delete this assessment?"
        >
            Delete
        </button>
    </td>
</tr>
