{% extends "base.html" %}

{% block content %}
<h2>Pending User Registrations</h2>

<!--hx-trigger attribute listens for a custom event called userApproved-->
<div
    id="pending-users-container"
    hx-get="/ui/admin/users/table"
    hx-trigger="userApproved from:body"
    hx-swap="innerHTML"
>
    {% include "partials/pending_users_table.html" %}
</div>

{% endblock %}
